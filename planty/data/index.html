<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planty Dashboard</title>
    <meta http-equiv="refresh" content="5">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class='card'>
        <h1>🌱 Planty Dashboard</h1>
        
        <div class='sensor-box'>
            <span class='label'>Soil Moisture</span>
            <span class='value'>%WATER_VAL%%</span>
        </div>

        <div class='sensor-box'>
            <span class='label'>Light Level</span>
            <span class='value'>%LIGHT_VAL%%</span>
        </div>
    </div>
</body>
</html>
