<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planty – Plant Health</title>
    <meta name="theme-color" content="#101812">

    <link rel="icon" type="image/png"
        href="https://github.com/nicolasrie/planty/blob/main/assets/leafs.png?raw=true">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
<main class="container">

    <header class="header">
        <div class="brand">
            <img src="https://github.com/nicolasrie/planty/blob/main/assets/leafs.png?raw=true"
                alt="Planty Logo" class="logo">
            <div>
                <h1>Planty</h1>
                <p>Plant health monitoring</p>
            </div>
        </div>

        <div class="connection">
            <span class="connection-dot"></span>
            <span>Live monitoring</span>
        </div>
    </header>

    <section class="dashboard">

        <div class="welcome">
            <h2>Plant overview<span>.</span></h2>
            <i data-lucide="sprout" class="plant-icon"></i>
        </div>

        <div class="sensor-grid">

            <!-- Soil Moisture -->
            <article class="sensor-card">
                <div class="card-top">
                    <div class="sensor-icon moisture-icon">
                        <i data-lucide="droplets"></i>
                    </div>
                    <span class="card-category">SOIL</span>
                </div>

                <div class="card-info">
                    <span class="sensor-label">Soil moisture</span>
                    <div class="sensor-value" id="waterValue">
                        %WATER_VAL%<span>%</span>
                    </div>
                    <p class="sensor-description">
                        Water content in the soil
                    </p>
                </div>

                <div class="card-bottom">
                    <div class="progress-track">
                        <div class="progress-fill moisture-fill"
                            id="waterProgress" style="width:0%"></div>
                    </div>
                    <span class="progress-label">MOISTURE LEVEL</span>
                </div>
            </article>

            <!-- Light Level -->
            <article class="sensor-card">
                <div class="card-top">
                    <div class="sensor-icon light-icon">
                        <i data-lucide="sun"></i>
                    </div>
                    <span class="card-category">LIGHT</span>
                </div>

                <div class="card-info">
                    <span class="sensor-label">Light level</span>
                    <div class="sensor-value" id="lightValue">
                        %LIGHT_VAL%<span>%</span>
                    </div>
                    <p class="sensor-description">
                        Available light intensity
                    </p>
                </div>

                <div class="card-bottom">
                    <div class="progress-track">
                        <div class="progress-fill light-fill"
                            id="lightProgress" style="width:0%"></div>
                    </div>
                    <span class="progress-label">LIGHT INTENSITY</span>
                </div>
            </article>

        </div>
    </section>

    <footer class="footer">
        <span class="copyright">© 2026 Planty</span>

        <a href="https://github.com/nicolasrie/planty"
            target="_blank" rel="noopener noreferrer"
            class="github-button" aria-label="Planty on GitHub">
            <i data-lucide="github"></i>
            <span>GitHub</span>
        </a>
    </footer>
</main>

    <script>
        lucide.createIcons();

        async function updateDashboard() {
            try {
                const response = await fetch("/api/status");

                if (!response.ok) throw new Error("API request failed");

                const data = await response.json();
                const water = Number(data.water);
                const light = Number(data.light);

                if (!Number.isFinite(water) || !Number.isFinite(light)) {
                    throw new Error("Invalid sensor data");
                }

                document.getElementById("waterValue").innerHTML =
                    `${water}<span>%</span>`;

                document.getElementById("lightValue").innerHTML =
                    `${light}<span>%</span>`;

                document.getElementById("waterProgress").style.width =
                    `${Math.max(0, Math.min(100, water))}%`;

                document.getElementById("lightProgress").style.width =
                    `${Math.max(0, Math.min(100, light))}%`;

            } catch (error) {
                console.error("Dashboard update failed:", error);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
