<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planty</title>
    <meta name="theme-color" content="#111111">

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="https://github.com/nicolasrie/planty/blob/main/assets/leafs.png?raw=true"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <img
                    src="https://github.com/nicolasrie/planty/blob/main/assets/leafs.png?raw=true"
                    alt="Planty Logo"
                    class="logo"
                >
                <div class="brand-text">
                    <h1>Planty</h1>
                    <p>Your plant health checker</p>
                </div>
            </div>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="sensor-grid">
                <!-- Soil Moisture -->
                <div class="sensor-card">
                    <span class="sensor-label">
                        SOIL MOISTURE
                    </span>
                    <div class="sensor-value">
                        %WATER_VAL%<span>%</span>
                    </div>
                </div>

                <!-- Light Level -->
                <div class="sensor-card">
                    <span class="sensor-label">
                        LIGHT LEVEL
                    </span>
                    <div class="sensor-value">
                        %LIGHT_VAL%<span>%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span class="copyright">
                © 2026 Planty
            </span>
            <a
                href="https://github.com/nicolasrie/planty"
                target="_blank"
                rel="noopener noreferrer"
                class="github-button"
                aria-label="Planty on GitHub"
            >
                <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="currentColor"
                    aria-hidden="true"
                >
                    <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.08c-3.1.67-3.76-1.32-3.76-1.32-.5-1.3-1.23-1.65-1.23-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.51 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.56 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.78 1.15 3 0 4.28-2.62 5.23-5.11 5.5.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
                </svg>
                <span>GitHub</span>
            </a>
        </footer>
    </main>
</body>
</html>
